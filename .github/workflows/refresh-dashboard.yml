name: Build dashboard data

on:
  workflow_dispatch:
  schedule:
    # 06:15 South Africa Standard Time (UTC+2)
    - cron: "15 4,12,20 * * *"
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "src/ingestion/**"
      - "src/transformation/**"
      - "src/skills/**"
      - "src/analytics/**"
      - "requirements.txt"
      - ".github/workflows/refresh-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Collect public vacancy snapshots
        id: collect
        continue-on-error: true
        run: python -m src.ingestion.collect

      - name: Build canonical jobs
        run: python -m src.transformation.build

      - name: Extract skills and requirements
        run: python -m src.skills.build

      - name: Build dashboard data marts
        run: python -m src.analytics.build

      - name: Run tests
        run: python -m pytest

      - name: Upload dashboard data artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          if-no-files-found: error
          retention-days: 14
          path: |
            data/processed/dashboard_jobs.parquet
            data/processed/dashboard_skills.parquet
            data/processed/dashboard-quality-report.json

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/processed/dashboard_jobs.parquet \
            data/processed/dashboard_skills.parquet \
            data/processed/dashboard-quality-report.json

          if git diff --cached --quiet; then
            echo "Dashboard data did not change."
          else
            git commit -m "Refresh dashboard data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Report partial collection failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::One or more providers failed. The dashboard was rebuilt from the successful snapshots."
